name: daily check

# every built-in endpoint once a night, one row each into data/daily.csv. run from a github
# runner, so the latency column is from wherever github puts it, the same place every night.

on:
  schedule:
    - cron: "53 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m rpcprobe --summary-append data/daily.csv --quiet
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.csv
          git diff --cached --quiet || git commit -m "data: snapshot $(date -u +%F)"
          git push
